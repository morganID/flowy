[package]
name = "flowy"
version = "0.1.0"
edition = "2024"
description = "Google Flow image generation from the command line, driven through Safari"
license = "MIT"

[dependencies]
safari-driver = { path = "/Users/user/safari-driver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tiny_http = "0.12"
